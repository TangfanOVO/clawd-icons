const states={"search": ["正在查找", "先探头，把线索找出来。"], "pencil": ["正在写作", "把想法一点点写下来。"], "mic": ["正在聆听", "你的声音，我在听。"], "trophy": ["已经完成", "做到了，挥挥手庆祝。"], "sleep": ["暂时休息", "停下来，安静待一会儿。"]};let current='search';
function play(){const el=document.querySelector('[data-icon="'+current+'"]');if(current==='sleep'){ClawdMotion.asleep(el,true)}else{ClawdMotion.asleep(el,false);ClawdMotion.play(el)}}
document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>{document.querySelectorAll('.status-icon').forEach(el=>ClawdMotion.stop(el));current=button.dataset.state;document.querySelectorAll('[data-icon]').forEach(el=>el.hidden=el.dataset.icon!==current);document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#status-title').textContent=states[current][0];document.querySelector('#status-detail').textContent=states[current][1];play()});
document.querySelector('#replay').onclick=play;document.querySelectorAll('.reaction').forEach(el=>el.onclick=()=>ClawdMotion.play(el));
</script></html>
