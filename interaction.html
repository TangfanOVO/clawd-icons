const grid=document.querySelector('.grid'),page=document.querySelector('#page'),state=document.querySelector('#state'),mode=document.querySelector('#mode'),speed=document.querySelector('#speed');
const focus=['package','glasses','car','book','icecream-top','music','laptop','wand','folder','rocket','umbrella-top','heart'];
const params=new URLSearchParams(location.search);page.value=params.get('page')||'1';
function all(){return [...grid.querySelectorAll('svg.cr')]}
function stop(){all().forEach(s=>{ClawdMotion.stop(s);s.getAnimations({subtree:true}).forEach(a=>a.cancel())})}
function render(){stop();let selected=page.value==='focus'?focus.map(n=>rows.find(r=>r.name==='clawd-'+n)):rows.slice((+page.value-1)*28,+page.value*28);grid.innerHTML=selected.map(r=>`<article class="tile" data-name="${r.name}"><div class="main-icon" role="button" tabindex="0" aria-label="播放${r.label}">${svg[r.name]}</div><h2>${r.label}</h2><p class="caption">${r.interaction}</p><div class="sizes">${svg[r.name]}16<span class="large">${svg[r.name]}</span>24px</div></article>`).join('');grid.querySelectorAll('.main-icon').forEach(el=>{el.onclick=()=>ClawdMotion.play(el,mode.value);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.onclick()}}});state.textContent='静态';history.replaceState(null,'','?page='+page.value)}
function start(){stop();all().forEach(s=>{s.style.setProperty('--cr-speed',speed.value);ClawdMotion.play(s,mode.value)})}
document.querySelector('#play').onclick=()=>{start();state.textContent='播放中'};
document.querySelector('#rest').onclick=()=>{stop();state.textContent='静态'};
document.querySelectorAll('.frame').forEach(b=>b.onclick=()=>{start();all().forEach(s=>s.getAnimations({subtree:true}).forEach(a=>{a.pause();a.currentTime=a.effect.getTiming().duration*+b.dataset.frame}));state.textContent='动作 '+b.textContent});
page.onchange=render;mode.onchange=()=>{stop();state.textContent='静态'};render();</script></html>
